name: Build Madeira IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_i386:
        description: 'Build the optional 32-bit (i386/WoW64) PE set'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools via Homebrew
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix sevenzip)/bin" >> $GITHUB_PATH

      - name: Configure LLVM environment
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$LLVM_PREFIX" >> "$GITHUB_ENV"
          "$LLVM_PREFIX/bin/llvm-config" --version || true

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('scripts/build-ipa.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/llvm-mingw-*
          key: ${{ runner.os }}-llvm-mingw-20260421

      - name: Cache LLVM iOS static libraries
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ${{ runner.os }}-llvm-ios-15.0.7-v2

      - name: Cache FEX build
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: ${{ runner.os }}-fex-ios-cxx20-v8-${{ hashFiles('FEX/**', 'scripts/build/build-fex-ios.sh', 'scripts/patch_fex_atomic_ref.sh') }}
          restore-keys: |
            ${{ runner.os }}-fex-ios-cxx20-v8-

      - name: Clean FEX build tree
        run: rm -rf FEX/build-ios

      - name: Cache Wine host build
        uses: actions/cache@v4
        with:
          path: |
            wine/build-macos
            wine/build-arm64ec
            wine/build-i386
          # v3: bumped so this entry can actually store wine/build-i386. A cache
          # key that already exists is restored but never re-saved, so leaving it
          # at v2 would have rebuilt the i386 PE set on every run.
          key: ${{ runner.os }}-wine-host-v3-${{ hashFiles('wine/**', 'scripts/build-ipa.sh', 'scripts/build/build-wine.sh') }}
          restore-keys: |
            ${{ runner.os }}-wine-host-v3-

      - name: Clean Wine build trees
        run: |
          # build-i386 is deliberately NOT cleaned: a full i386 PE build is the
          # most expensive thing this job adds, and keeping the tree lets `make`
          # stay incremental. The cache key hashes wine/** and build-wine.sh, so
          # a source or flag change still starts it from scratch.
          rm -rf wine/build-macos wine/build-arm64ec build/wineserver/obj

      - name: Clean DXMT iOS build tree and VC runtime cache
        run: |
          rm -rf build/dxmt-ios/obj app/Madeira/libdxmt_combined.a
          rm -f toolchains/downloads/vc_redist*
          rm -rf toolchains/downloads/vc_redist* app/Madeira/x86_64-vcruntime

      - name: Configure Apple compiler environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer" >> "$GITHUB_ENV"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --find clang)"
          export CXX="$(xcrun --find clang++)"
          export OBJC="$(xcrun --find clang)"
          export OBJCXX="$(xcrun --find clang++)"
          {
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "OBJC=$OBJC"
            echo "OBJCXX=$OBJCXX"
          } >> "$GITHUB_ENV"
          "$CC" --version
          xcrun --sdk macosx --show-sdk-path

      - name: Fix script permissions
        run: |
          find scripts build -type f -name '*.sh' -exec chmod +x {} +

      - name: Run build-ipa.sh
        env:
          # The optional 32-bit PE set. build-wine.sh builds it only when
          # MADEIRA_BUILD_I386=1, and package-ipa.sh then bundles
          # app/Madeira/i386-windows automatically when it exists — no commit
          # needed, which matters because the other two PE sets are ~110-134 MB.
          # On by default for push and PR too; dispatch a run with build_i386
          # unchecked to produce a non-WoW64 bundle for comparison.
          MADEIRA_BUILD_I386: ${{ github.event_name == 'workflow_dispatch' && inputs.build_i386 == false && '0' || '1' }}
        run: |
          ./scripts/build-ipa.sh

      - name: Print failed DXMT compiler logs
        if: failure()
        run: |
          find build/dxmt-ios/obj -type f -name '*.err' -print -exec sh -c '
            echo "===== $1 ====="
            cat "$1"
          ' sh {} \;

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: dist/Madeira.ipa
          if-no-files-found: error

      - name: Publish Release for SideStore / LiveContainer Auto-Update
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Madeira Latest"
          body: |
            Automated latest build for Madeira.
            Add this repo source to SideStore or LiveContainer to receive automatic updates:
            `https://raw.githubusercontent.com/SaimSuhailQu/Madeira/main/apps.json`
          files: dist/Madeira.ipa
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
