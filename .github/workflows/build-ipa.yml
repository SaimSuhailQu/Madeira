name: Build Madeira IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools via Homebrew
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('scripts/build-ipa.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/llvm-mingw-*
          key: ${{ runner.os }}-llvm-mingw-20260421

      - name: Cache LLVM iOS static libraries
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ${{ runner.os }}-llvm-ios-15.0.7

      - name: Cache FEX build
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: ${{ runner.os }}-fex-ios-cxx20-v8-${{ hashFiles('FEX/**', 'scripts/build/build-fex-ios.sh', 'scripts/patch_fex_atomic_ref.sh') }}
          restore-keys: |
            ${{ runner.os }}-fex-ios-cxx20-v8-

      - name: Clean FEX build tree
        run: rm -rf FEX/build-ios

      - name: Cache Wine host build
        uses: actions/cache@v4
        with:
          path: |
            wine/build-macos
            wine/build-arm64ec
          key: ${{ runner.os }}-wine-host-v2-${{ hashFiles('wine/**', 'scripts/build-ipa.sh', 'scripts/build/build-wine.sh') }}
          restore-keys: |
            ${{ runner.os }}-wine-host-v2-

      - name: Clean Wine build trees
        run: |
          rm -rf wine/build-macos wine/build-arm64ec build/wineserver/obj

      - name: Fix script permissions
        run: |
          find scripts build -type f -name '*.sh' -exec chmod +x {} +

      - name: Run build-ipa.sh
        run: |
          ./scripts/build-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: dist/Madeira.ipa
          if-no-files-found: error
