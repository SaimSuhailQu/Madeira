name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config meson bison flex llvm sevenzip
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Set up llvm-mingw Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          echo "Downloading llvm-mingw..."
          # Fetch the latest macos-universal release of llvm-mingw
          LLVM_URL=$(curl -s https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest | grep "browser_download_url.*ucrt-macos-universal.tar.xz" | cut -d '"' -f 4)
          echo "Downloading from $LLVM_URL"
          curl -L -o llvm-mingw.tar.xz "$LLVM_URL"
          tar -xf llvm-mingw.tar.xz
          
          # Find extracted directory and alias/symlink to the expected name
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "llvm-mingw*" | head -n 1)
          echo "Extracted toolchain: $EXTRACTED_DIR"
          ln -s "$EXTRACTED_DIR" llvm-mingw-20260421-ucrt-macos-universal
          
          # Add to PATH
          echo "$(pwd)/$EXTRACTED_DIR/bin" >> $GITHUB_PATH
          cd ..

      - name: Fetch and Extract VC Runtime DLLs
        run: |
          mkdir -p /tmp/vcredist app/Madeira/x86_64-vcruntime
          echo "Downloading VC_redist.x64.exe..."
          curl -L -o /tmp/vcredist/VC_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          7zz x /tmp/vcredist/VC_redist.x64.exe -o/tmp/vcredist/extracted -y
          find /tmp/vcredist/extracted -name "*.cab" -exec 7zz e {} -oapp/Madeira/x86_64-vcruntime/ -y \; || true
          echo "Extracted VCRuntime files:"
          ls -la app/Madeira/x86_64-vcruntime/

      - name: Run Build Scripts
        run: |
          chmod -R +x build scripts tools || true
          
          # Run build scripts (excluding standalone test samples if they fail)
          for dir in build/*/; do
            if [ -f "${dir}build.sh" ]; then
              echo "=== Building ${dir} ==="
              bash "${dir}build.sh" || echo "Warning: ${dir}build.sh failed, continuing..."
            fi
          done

      - name: Build App with Xcode
        run: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJ" ]; then
            PROJ=$(find app -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          fi
          echo "Using Project: $PROJ"
          
          if [[ "$PROJ" == *.xcworkspace ]]; then
            xcodebuild build \
              -workspace "$PROJ" \
              -scheme Madeira \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CONFIGURATION_BUILD_DIR="$(pwd)/build_output"
          else
            xcodebuild build \
              -project "$PROJ" \
              -scheme Madeira \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CONFIGURATION_BUILD_DIR="$(pwd)/build_output"
          fi

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build_output/*.app Payload/
          zip -r Madeira.ipa Payload/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: |
            Madeira.ipa
            build_output/*.app
