# Madeira — Flatpak manifest.
#
# Packages the self-contained runtime tarball (linux/build-runtime.sh output)
# on the Freedesktop 24.08 runtime. Because the bundled Wine is a single
# "new-WoW64" build (--enable-archs=x86_64,i386 → all PE code runs through the
# 64-bit ntdll), neither org.freedesktop.Platform.Compat.i386 nor any 32-bit
# host library is required. GPU user-space drivers come from the runtime's
# GL extensions (org.freedesktop.Platform.GL.default / GL.NVIDIA), so Mesa and
# NVIDIA versions keep tracking the host without rebuilding this app.
#
# Dev build: expects dist/madeira-runtime-$(uname -m).tar.gz next to linux/.
# Release:   swap the archive source for `url:` + `sha256:` (see comment below).
app-id: com.madeira.Madeira
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: madeira
separate-locales: false
rename-icon: madeira
finish-args:
  # --- graphics -------------------------------------------------------------
  # DRI3/render-node access for Vulkan + GL. NVIDIA user-space is injected by
  # the org.freedesktop.Platform.GL.NVIDIA extension automatically.
  - --device=dri
  # Gamepads/HOTAS via evdev (SDL); remove to shrink the attack surface.
  - --device=input
  # --- windowing ------------------------------------------------------------
  # X11 covers XWayland (default Wine backend); Wayland socket enables the
  # opt-in native Wayland driver (MADEIRA_ENABLE_WAYLAND=1).
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # --- audio ----------------------------------------------------------------
  # pulseaudio socket talks to PulseAudio OR PipeWire's pipewire-pulse.
  - --socket=pulseaudio
  # --- network (Steam client, game multiplayer, CDN) -------------------------
  - --share=network
  # --- desktop integration ---------------------------------------------------
  - --talk-name=org.freedesktop.Notifications
  # Read-only home lets users point at existing game installs; everything the
  # app writes lives in ~/.var/app/com.madeira.Madeira/ (auto-redirected
  # XDG_DATA_HOME) and needs no extra permission.
  - --filesystem=home:ro
  # Optional, commented: uncomment for i386 ELF compat if a game's Linux-side
  # launcher scripts need it (the Wine WoW64 runtime itself does NOT):
  # - --allow=multiarch
  # --- fixed environment -----------------------------------------------------
  - --env=WINEDEBUG=-all
  - --env=WINEDLLOVERRIDES=mscoree=d;mshtml=d
modules:
  - name: madeira-runtime
    buildsystem: simple
    build-commands:
      # Payload: bin/ lib/ share/ (wine, dxvk, vkd3d-proton, prefix template)
      - cp -r bin lib share ${FLATPAK_DEST}/
      - install -Dm755 bin/madeira ${FLATPAK_DEST}/bin/madeira
      # Desktop integration (Icon=madeira → renamed to app-id by rename-icon)
      - install -Dm644 packaging/com.madeira.Madeira.desktop
                      ${FLATPAK_DEST}/share/applications/com.madeira.Madeira.desktop
      - install -Dm644 packaging/com.madeira.Madeira.metainfo.xml
                      ${FLATPAK_DEST}/share/metainfo/com.madeira.Madeira.metainfo.xml
      - install -Dm644 packaging/madeira.png
                      ${FLATPAK_DEST}/share/icons/hicolor/1024x1024/apps/madeira.png
    sources:
      # ---- local dev build (path source) ------------------------------------
      - type: archive
        path: ../../dist/madeira-runtime-x86_64.tar.gz
      # ---- release build (replace the block above with this) ----------------
      # - type: archive
      #   url: https://github.com/SaimSuhailQu/Madeira/releases/download/v0.1.0/madeira-runtime-x86_64.tar.gz
      #   sha256: <fill-before-merging>
      #   x-checker-data:
      #     type: generic
      #     url: https://api.github.com/repos/SaimSuhailQu/Madeira/releases/latest
